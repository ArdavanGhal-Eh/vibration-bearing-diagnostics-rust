[package]
name = "vibration-bearing-diagnostics-rust"
version = "0.1.0"
edition = "2021"
authors = ["Ardavan Ghal-Eh <ardavang2007@gmail.com>"]
description = "Real-Time Edge Vibration FFT & Bearing Fault Diagnostic Engine in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "vibration_diagnostics"
crate-type = ["cdylib", "rlib"]
